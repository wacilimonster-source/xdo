name: Build & Release

# 发版流程（全部在 CI 完成，本地不再手工构建/上传 APK）：
#   1. ./scripts/release.sh "更新说明"      # 只改 version.txt + 提交 + 打 tag + 推送
#   2. 本工作流自动构建 → 校验签名 → 上传 GitHub Release → 回写 version.txt 的 apkUrl
# 普通 push 到 main 只做「构建 + 单测」验证，不发布。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 同一分支/同一个 tag 的构建串行执行，避免并发抢 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # v0.2.8 及更早版本的历史签名证书 SHA-256；一旦变化，老用户将无法覆盖安装。
  EXPECTED_CERT_SHA256: "b8ec03536aa7424f3d88630170d9a45f500f826e6ad952cf12d8391e78b40817"

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      versionCode: ${{ steps.meta.outputs.versionCode }}
      signed: ${{ steps.keystore.outputs.ready }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 读取 version.txt（版本唯一来源）
        id: meta
        run: |
          echo "version=$(jq -r .versionName version.txt)" >> "$GITHUB_OUTPUT"
          echo "versionCode=$(jq -r .versionCode version.txt)" >> "$GITHUB_OUTPUT"
          echo "--- version.txt ---"
          cat version.txt

      - name: 准备签名密钥
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XDO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 XDO_KEYSTORE_BASE64，本次使用 debug 签名（仅验证构建，不可发布）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xdo-release.keystore"
          echo "XDO_KEYSTORE_FILE=$RUNNER_TEMP/xdo-release.keystore" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 校验（发布构建必须带历史签名密钥）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${{ steps.keystore.outputs.ready }}" != "true" ]; then
            echo "::error::发布构建缺少签名密钥：请先在仓库 Secrets 配置 XDO_KEYSTORE_BASE64 等 4 项（运行 scripts/setup-ci-secrets.sh）"
            exit 1
          fi

      - name: 单元测试 + 构建 Release APK
        env:
          XDO_STORE_PASSWORD: ${{ secrets.XDO_STORE_PASSWORD }}
          XDO_KEY_ALIAS: ${{ secrets.XDO_KEY_ALIAS }}
          XDO_KEY_PASSWORD: ${{ secrets.XDO_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: 核对构建版本与签名证书
        run: |
          chmod +x ./gradlew
          ./gradlew -q :app:printBuildInfo
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $SIGNER"
          ACTUAL=$("$SIGNER" verify --print-certs "$APK" \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z' || true)
          echo "证书指纹: ${ACTUAL:-<未取到>}"
          if [ "${{ steps.keystore.outputs.ready }}" = "true" ]; then
            if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::签名证书与历史版本不一致（期望 $EXPECTED_CERT_SHA256），老用户将无法覆盖安装"
              exit 1
            fi
          fi

      - name: 整理产物
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/xdo_v${VERSION}.apk"
          cd dist
          sha256sum "xdo_v${VERSION}.apk" | tee SHA256SUMS.txt
          ls -l

      - name: 上传产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: xdo-apk
          path: dist/*
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main（回写 version.txt 用）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: xdo-apk
          path: dist

      - name: 校验 tag 与 version.txt 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(jq -r .versionName version.txt)
          FILE_CODE=$(jq -r .versionCode version.txt)
          echo "tag=$GITHUB_REF_NAME version.txt=$FILE_VERSION (code $FILE_CODE)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 version.txt 的 versionName $FILE_VERSION 不一致，请先修正 version.txt 再发版"
            exit 1
          fi

      - name: 生成 Release 说明
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## xdo v${VERSION}"
            echo
            echo "$(jq -r .updateMessage version.txt)"
            echo
            echo "**versionCode**: $(jq -r .versionCode version.txt)  ·  **minSdk**: 26  ·  **签名**: 历史密钥（可覆盖安装 v0.2.8 及更早版本）"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          cat notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，覆盖上传资产"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/xdo_v${VERSION}.apk" dist/SHA256SUMS.txt \
              --title "xdo v${VERSION}" \
              --notes-file notes.md
          fi

      - name: 等待直链可下载
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/xdo_v${GITHUB_REF_NAME#v}.apk"
          for i in $(seq 1 10); do
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
            echo "第 ${i} 次探测 $URL -> $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 3
          done
          echo "::error::Release 资产直链仍不可访问：$URL"
          exit 1

      - name: 回写 version.txt 的下载直链
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/xdo_v${VERSION}.apk"
          CURRENT=$(jq -r .apkUrl version.txt)
          if [ "$CURRENT" = "$URL" ]; then
            echo "apkUrl 已正确：$URL"
            exit 0
          fi
          jq --arg u "$URL" '.apkUrl = $u' version.txt > version.tmp && mv version.tmp version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore(release): version.txt 指向 v${VERSION} 下载直链 [skip ci]"
          git push origin HEAD:main || echo "::warning::version.txt 回写推送失败（可能受分支保护限制），请手动把 apkUrl 改为 $URL"
